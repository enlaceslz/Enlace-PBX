<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern Icon Badge -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#brandGrad)" filter="url(#glow)" />
    
    <!-- Sound Waves & Telecom Nodes -->
    <path d="M 40,60 A 20,20 0 0,1 60,40" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
    <path d="M 32,60 A 28,28 0 0,1 60,32" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <path d="M 80,60 A 20,20 0 0,1 60,80" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
    <path d="M 88,60 A 28,28 0 0,1 60,88" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    
    <!-- Central AI Core Node -->
    <circle cx="60" cy="60" r="13" fill="#ffffff" />
    <circle cx="60" cy="60" r="6" fill="#2563eb" />
  </g>

  <!-- Typography -->
  <text x="150" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#0f172a" letter-spacing="-0.5">ENLACE<tspan fill="#2563eb">-PBX</tspan></text>
  <text x="152" y="102" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#64748b" letter-spacing="2.5">TELECOM &amp; ENTERPRISE AI</text>
</svg>
