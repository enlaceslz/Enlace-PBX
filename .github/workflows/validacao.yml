name: Validação de segurança e produção
on:
  pull_request:
  push:
    branches: [main, 'auditoria/**']
permissions:
  contents: read
jobs:
  validacao:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enlace_pbx
          POSTGRES_PASSWORD: senha-descartavel-do-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: chave-de-teste-descartavel-com-mais-de-32-caracteres-2026
      ENCRYPTION_KEY: outra-chave-descartavel-com-mais-de-32-caracteres-2026
      CORS_ALLOWED_ORIGINS: https://pbx.example.invalid
      DATABASE_MIGRATION_URL: postgresql://postgres:senha-descartavel-do-ci@127.0.0.1:5432/enlace_pbx
      ADMIN_INITIAL_EMAIL: admin@example.invalid
      ADMIN_INITIAL_PASSWORD: senha-bootstrap-descartavel-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:security
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Aplicar migrações com credencial administrativa separada
        run: NODE_ENV=production npm run db:migrate
      - name: Configurar senha descartável da role operacional
        run: psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE enlace_app PASSWORD 'senha-app-descartavel-ci'"
      - name: Validar PostgreSQL real em modo de produção
        run: node --import tsx scripts/postgres-integration.ts
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://enlace_app:senha-app-descartavel-ci@127.0.0.1:5432/enlace_pbx
          PBX_INTEGRATION_DATABASE: descartavel
