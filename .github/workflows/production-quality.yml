name: Production quality gate

on:
  push:
    branches:
      - main
      - chore/producao-hardening-20261023
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Check shell syntax
        run: |
          bash -n deploy.sh
          bash -n install-enlace-pbx.sh
      - name: Test Asterisk configuration reconciler
        run: python3 scripts/test-asterisk-config.py
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: TypeScript checks
        run: npm run lint
      - name: Production build
        run: npm run build
