name: Production quality gate

on:
  push:
    branches:
      - main
      - chore/producao-hardening-20261023
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Verify dependency manifest and lockfile agree
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages[''];
          if (pkg.name !== lock.name || pkg.version !== lock.version ||
              JSON.stringify(pkg.dependencies) !== JSON.stringify(root.dependencies) ||
              JSON.stringify(pkg.devDependencies) !== JSON.stringify(root.devDependencies)) {
            console.error('package-lock.json differs from package.json; regenerate lockfile.');
            process.exit(1);
          }
          NODE
      - name: Check shell syntax
        run: |
          bash -n deploy.sh
          bash -n install-enlace-pbx.sh
          bash -n scripts/homologation-smoke.sh
      - name: Test homologation smoke failure handling
        run: python3 scripts/test-homologation-smoke.py
      - name: Test Asterisk configuration reconciler
        run: python3 scripts/test-asterisk-config.py
      - name: Test installer safety invariants
        run: python3 scripts/test-installer-safety.py
      - name: Test environment preservation
        run: python3 scripts/test-merge-env.py
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: TypeScript checks
        run: npm run lint
      - name: Application test suite
        run: npm test
      - name: Production build
        run: npm run build

  postgres-roundtrip:
    name: PostgreSQL disposable backup/restore roundtrip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pbx_ci_tester
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: enlace_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbx_ci_tester -d enlace_restore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          test -x /usr/lib/postgresql/16/bin/pg_dump
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Validate roundtrip shell syntax
        run: |
          bash -n scripts/test-postgres-roundtrip.sh
          bash -n scripts/restore-postgres-test.sh
      - name: Test operational PostgreSQL backup script
        env:
          CI_TEST_DB_URL: postgresql://pbx_ci_tester:ci_disposable_only@127.0.0.1:5432/enlace_restore_test
        run: |
          set -Eeuo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf -- "$temp_dir"' EXIT
          mkdir -p "$temp_dir/app" "$temp_dir/backups"
          printf 'DATABASE_URL=%s\n' "$CI_TEST_DB_URL" > "$temp_dir/app/.env"
          chmod 600 "$temp_dir/app/.env"
          APP_DIR="$temp_dir/app" BACKUP_DIR="$temp_dir/backups" bash scripts/backup-postgres.sh
          test "$(find "$temp_dir/backups" -maxdepth 1 -name 'enlace-pbx-postgres-*.dump' -type f | wc -l)" -eq 1
          pg_restore --list "$temp_dir/backups"/enlace-pbx-postgres-*.dump >/dev/null
      - name: Test coordinated backup and manifest on disposable runner
        env:
          CI_TEST_DB_URL: postgresql://pbx_ci_tester:ci_disposable_only@127.0.0.1:5432/enlace_restore_test
        run: |
          set -Eeuo pipefail
          temp_dir="$(mktemp -d)"
          trap 'sudo rm -rf -- "$temp_dir"; sudo rm -rf -- /var/lib/enlace-pbx/ci-backup-fixture' EXIT
          mkdir -p "$temp_dir/app" "$temp_dir/backups"
          printf 'DATABASE_URL=%s\n' "$CI_TEST_DB_URL" > "$temp_dir/app/.env"
          chmod 600 "$temp_dir/app/.env"
          sudo mkdir -p /var/lib/enlace-pbx/ci-backup-fixture
          printf 'CI disposable PBX fixture\n' | sudo tee /var/lib/enlace-pbx/ci-backup-fixture/README >/dev/null
          sudo env APP_DIR="$temp_dir/app" BACKUP_DIR="$temp_dir/backups" bash scripts/backup-coordinated.sh
          test "$(find "$temp_dir/backups" -maxdepth 1 -name 'enlace-pbx-backup-*.manifest' -type f | wc -l)" -eq 1
          sudo bash scripts/verify-backup-manifest.sh "$temp_dir/backups"/enlace-pbx-backup-*.manifest
          sudo pg_restore --list "$temp_dir/backups"/enlace-pbx-postgres-*.dump >/dev/null
          sudo tar -tzf "$temp_dir/backups"/enlace-pbx-files-*.tar.gz | grep -q 'ci-backup-fixture/README'
      - name: Test real PostgreSQL dump and restore
        env:
          CI_TEST_DB_URL: postgresql://pbx_ci_tester:ci_disposable_only@127.0.0.1:5432/enlace_restore_test
        run: printf '%s' "$CI_TEST_DB_URL" | bash scripts/test-postgres-roundtrip.sh --stdin
