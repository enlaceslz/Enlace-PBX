name: Production quality gate

on:
  push:
    branches:
      - main
      - chore/producao-hardening-20261023
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Verify dependency manifest and lockfile agree
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages[''];
          if (pkg.name !== lock.name || pkg.version !== lock.version ||
              JSON.stringify(pkg.dependencies) !== JSON.stringify(root.dependencies) ||
              JSON.stringify(pkg.devDependencies) !== JSON.stringify(root.devDependencies)) {
            console.error('package-lock.json differs from package.json; regenerate lockfile.');
            process.exit(1);
          }
          NODE
      - name: Check shell syntax
        run: |
          bash -n deploy.sh
          bash -n install-enlace-pbx.sh
          bash -n scripts/homologation-smoke.sh
      - name: Test Asterisk configuration reconciler
        run: python3 scripts/test-asterisk-config.py
      - name: Test installer safety invariants
        run: python3 scripts/test-installer-safety.py
      - name: Test environment preservation
        run: python3 scripts/test-merge-env.py
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: TypeScript checks
        run: npm run lint
      - name: Application test suite
        run: npm test
      - name: Production build
        run: npm run build
