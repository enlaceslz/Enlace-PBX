name: Repair dependency lockfile on hardening branch

on:
  push:
    branches:
      - chore/producao-hardening-20261023
    paths:
      - .github/workflows/repair-lockfile.yml
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/chore/producao-hardening-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Regenerate package lockfile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Validate lockfile with clean install
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Commit corrected lockfile only
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json
            git commit -m "fix(deps): synchronize npm lockfile with package manifest"
            git push origin HEAD:chore/producao-hardening-20261023
          else
            echo "Lockfile already synchronized"
          fi
